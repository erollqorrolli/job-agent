# Safe defaults. Live submission is OFF until you flip it (dashboard or here).
source_url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
term: "Summer 2027"
poll_minutes: 120
live_submit: false          # false = fill + validate + screenshot, never click final submit
handoff: fallback           # always = you click Submit; fallback = auto then hand off if blocked; never = auto only
headless: false             # headed lets you watch and solve CAPTCHAs
max_per_session: 50
max_ready_tabs: 20          # completed/question tabs kept open before the worker waits (1-100)
max_retries: 3
delay_seconds: [20, 45]     # randomized pause between applications (polite pacing)
priorities: [1, 2, 3]       # which priority tiers to process
countries: [US]             # allowed countries; "Remote" always allowed
excluded_keywords: []       # e.g. ["hardware", "mechanical"]
browser_profile: browser_profile
browser_channel: chrome      # installed Google Chrome; tests keep using disposable Playwright Chromium
llm:                        # any OpenAI-compatible endpoint. Set LLM_API_KEY in env.
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  model: gemini-2.0-flash

# Strong model used for format-safe LaTeX resume patches and essay drafts.
# Connect an eligible ChatGPT plan from the dashboard, or switch to Gemini and
# add an AI Studio key. The general `llm` above parses only the job description;
# complete resume context goes to this premium model. OpenAI API-key mode remains.
resume_editor:
  enabled: true
  provider: chatgpt
  models:
    chatgpt: ""                    # populated from the signed-in account
    gemini: gemini-3.8-flash       # strongest current Flash model; free-tier eligible
    openai: gpt-5.4-mini
  base_urls:
    chatgpt: https://api.openai.com/v1
    gemini: https://generativelanguage.googleapis.com/v1beta
    openai: https://api.openai.com/v1
  max_source_chars: 16000
  max_output_tokens: 6500
